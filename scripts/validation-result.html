                    eyeIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>';
                } else {
                    passwordInput.type = 'password';
                    eyeIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>';
                }
            }
        </script>

        <script>
            /**
             * Recarga la página automáticamente después de un periodo de inactividad
             * para asegurar que el token CSRF se mantenga vigente y evitar el error 419.
             */
            (function() {
                // Tiempo de vida de sesión en milisegundos (desde config de Laravel)
                const sessionLifetime = 6 * 60 * 1000;
                // Refrescar 2 minutos antes de que expire la sesión por seguridad
                const refreshTime = sessionLifetime - (2 * 60 * 1000);

                function autoRefresh() {
                    const fields = ['security_code', 'box_number', 'password'];
                    const isTyping = fields.some(id => {
                        const el = document.getElementById(id);
                        return el && el.value.length > 0;
                    });

                    if (!isTyping) {
                        window.location.reload();
                    } else {
                        // Si el usuario está escribiendo, reintentar en 5 minutos
                        setTimeout(autoRefresh, 5 * 60 * 1000);
                    }
                }
                // Se intenta el refresco inicial basado en la configuración de la sesión
                setTimeout(autoRefresh, refreshTime > 0 ? refreshTime : 60000);
            })();
        </script>
    </body>
